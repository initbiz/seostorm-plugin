include:
    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/setup-project-playground-3@1
      inputs:
          octobercms_license_key: "${PLAYGROUND_LICENSE_KEY}"
          github_machine_user_token: ${GITHUB_MACHINE_USER_TOKEN}

    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/setup-project-playground-4@1
      inputs:
          octobercms_license_key: "${PLAYGROUND_LICENSE_KEY}"
          github_machine_user_token: ${GITHUB_MACHINE_USER_TOKEN}

    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/rules-mr-events@1

    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/push-branch-to-github@1
      inputs:
          github_repo_url: "https://initbiz-machine-user:${GITHUB_MACHINE_USER_WRITE_TOKEN}@github.com/initbiz/seostorm-plugin.git"

    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/push-tags-to-github@1
      inputs:
          github_repo_url: "https://initbiz-machine-user:${GITHUB_MACHINE_USER_WRITE_TOKEN}@github.com/initbiz/seostorm-plugin.git"
     
    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/install-plugin-from-branch@1  

Tests:
    extends:
        - .rules-mr-events
        - .setup-project-playground-4
    script:
        - !reference [.install-plugin-from-branch, script]
        - vendor/bin/pest --parallel --ci --bail

Tests-october-3:
    extends:
        - .rules-mr-events
        - .setup-project-playground-3
    script:
        - !reference [.install-plugin-from-branch, script]
        - vendor/bin/pest --parallel --ci --bail

Linter:
    extends:
        - .rules-mr-events
        - .setup-project-playground-4
    script:
        - !reference [.install-plugin-from-branch, script]
        - php artisan linter:code -b plugins/initbiz/leaflet

Push-Branches-To-GitHub:
    rules:
        - if: $CI_COMMIT_BRANCH == "master"
        - if: $CI_COMMIT_BRANCH == "develop"
    extends:
        - .push-branch-to-github

Push-Tags-To-GitHub:
    rules:
        - if: $CI_COMMIT_TAG
    extends:
        - .push-tags-to-github
